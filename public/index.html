<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPulse - Conference & Ticket Portal</title>
  <link rel="stylesheet" href="app.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <span class="brand-badge">📍</span>
      <span class="brand-title">EventPulse</span>
    </div>
    <button class="cta-button" id="btn-host-event">Host an Event</button>

  <section class="hero-banner">
    <h1>Discover Live Tech Conferences & Workshops</h1>
    <p>Reserve your seat at upcoming software development summits and hands-on masterclasses.</p>

  <main class="events-grid-container">
    <div id="events-grid" class="events-grid"></div>
  </main>

  <script src="event_app.js"></script>
</body>
</html>
